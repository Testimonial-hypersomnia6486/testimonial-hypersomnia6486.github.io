    <p>Siete años entre análisis, diseño y desarrollo de microservicios, con foco en integridad de datos,

    encontrar la causa raíz antes que un parche que aguante hasta el viernes.</p>
    <p>Fuera de horario sigo aprendiendo por mi cuenta lo que el día a día no me exige — producto de principio
    a fin, con la IA como copiloto. Este sitio es un ejemplo.</p>
