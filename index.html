<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kepa Cuevas Barrasa · Elige tu CV</title>
<meta name="description" content="CV interactivo de Kepa Cuevas Barrasa. Elige edición: Matrix, Windows 98, Minimalista o Tierra Media.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%23111%22/><text x=%228%22 y=%2212%22 font-size=%2210%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22monospace%22>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="select.css">
</head>
<body>

<div class="stars" aria-hidden="true"></div>

<main class="select-screen">
  <p class="eyebrow">KEPA CUEVAS BARRASA · SOFTWARE ENGINEER</p>
  <h1 class="select-title">ELIGE TU CV</h1>
  <p class="select-sub">Mismo currículum, cuatro presentaciones. ¿Con cuál empezamos?</p>

  <div class="balls" role="listbox" aria-label="Ediciones del CV">

    <a class="ball-option" href="matrix/" role="option" data-key="1" data-ball="matrix">
      <span class="pokeball" aria-hidden="true">
        <span class="pb-half"></span>
        <span class="pb-band"></span>
        <span class="pb-button"><span class="pb-button-inner"></span></span>
      </span>
      <span class="ball-name">MATRIX</span>
      <span class="ball-sub">hacker · terminal</span>
    </a>

    <a class="ball-option" href="win98/" role="option" data-key="2" data-ball="win98">
      <span class="pokeball" aria-hidden="true">
        <span class="pb-half"></span>
        <span class="pb-band"></span>
        <span class="pb-button"><span class="pb-button-inner"></span></span>
      </span>
      <span class="ball-name">WINDOWS 98</span>
      <span class="ball-sub">retro-OS · nostalgia</span>
    </a>

    <a class="ball-option" href="minimal/" role="option" data-key="3" data-ball="minimal">
      <span class="pokeball" aria-hidden="true">
        <span class="pb-half"></span>
        <span class="pb-band"></span>
        <span class="pb-button"><span class="pb-button-inner"></span></span>
      </span>
      <span class="ball-name">MINIMALISTA</span>
      <span class="ball-sub">elegante · sin ruido</span>
    </a>

    <a class="ball-option" href="lotr/" role="option" data-key="4" data-ball="lotr">
      <span class="pokeball" aria-hidden="true">
        <span class="pb-half"></span>
        <span class="pb-band"></span>
        <span class="pb-button"><span class="pb-button-inner"></span></span>
      </span>
      <span class="ball-name">TIERRA MEDIA</span>
      <span class="ball-sub">fantasía · 8-bit RPG</span>
    </a>

  </div>

  <p class="select-hint">usa <kbd>←</kbd> <kbd>→</kbd> para moverte y <kbd>Enter</kbd> para elegir</p>
</main>

<script src="select.js"></script>
</body>
</html>
